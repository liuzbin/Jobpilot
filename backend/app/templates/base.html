<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}JobPilot{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f6f7f9; color: #1b1f24; }
    header { background: #1f2937; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
    header .brand { font-weight: 700; font-size: 18px; }
    header nav a { color: #d1d5db; text-decoration: none; margin-right: 16px; font-size: 14px; }
    header nav a.active, header nav a:hover { color: white; }
    main { max-width: 920px; margin: 24px auto; padding: 0 16px 60px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-top: 0; }
    h2 { font-size: 17px; }
    label { display: block; font-size: 13px; color: #4b5563; margin-top: 12px; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=number], input[type=url], input[type=password], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box;
    }
    textarea { min-height: 140px; font-family: inherit; }
    button, .btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
    button.secondary, .btn.secondary { background: #6b7280; }
    button:hover, .btn:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; font-size: 14px; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: white; }
    .status-pending { background: #9ca3af; }
    .status-analyzing { background: #f59e0b; }
    .status-analyzed { background: #10b981; }
    .status-tailored { background: #6366f1; }
    .status-applied { background: #1d4ed8; }
    .flash { background: #ecfdf5; border: 1px solid #10b981; color: #065f46; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    .flash.error { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
    .muted { color: #6b7280; font-size: 13px; }
    .score-total { font-size: 40px; font-weight: 700; }
    .breakdown-item { font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eee; }
    .company-block { border-left: 3px solid #2563eb; padding-left: 12px; margin-bottom: 16px; }
    .position-block { margin: 8px 0 8px 8px; }
    .bullet { font-size: 13px; color: #374151; margin: 2px 0; }
    .bullet-block { padding: 8px 0; border-bottom: 1px dashed #eee; }
    .tags { margin: 4px 0; }
    .tag { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin: 2px 4px 2px 0; }
    .qa-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .qa-question { color: #1b1f24; font-weight: 600; }
    .qa-answer { color: #4b5563; }
    .suggestion-block { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    /* 调用 LLM 的表单提交后展示的加载提示：见页面底部的通用脚本说明。 */
    .jobpilot-llm-loading { margin-top: 10px; display: flex; align-items: center; gap: 8px; color: #4b5563; font-size: 13px; }
    .jobpilot-spinner {
      width: 14px; height: 14px; flex: 0 0 auto;
      border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%;
      display: inline-block; animation: jobpilot-spin 0.8s linear infinite;
    }
    @keyframes jobpilot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <span class="brand">JobPilot</span>
    <nav>
      <a href="/dashboard/jobs" class="{% if active == 'jobs' %}active{% endif %}">投递列表</a>
      <a href="/dashboard/profile" class="{% if active == 'profile' %}active{% endif %}">我的画像</a>
      <a href="/dashboard/qa-bank" class="{% if active == 'qa_bank' %}active{% endif %}">问答题库</a>
      <a href="/dashboard/models" class="{% if active == 'models' %}active{% endif %}">模型配置</a>
      <a href="/dashboard/usage" class="{% if active == 'usage' %}active{% endif %}">用量统计</a>
    </nav>
  </header>
  <main>
    {% if flash %}<div class="flash {% if flash_error %}error{% endif %}">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // 通用的"调用 LLM 时不要让页面看起来卡住"提示：给需要展示加载态的表单加上
    // data-llm-loading="提示文案" 属性，提交时会立刻禁用表单里的提交按钮、并
    // 在表单下面插入一个带小圆圈动画的提示。这里刻意不改变原来"提交后等整页
    // 刷新展示结果"的流程（LLM 调用本身仍然是同步阻塞的），只是把"看起来像
    // 卡住了"变成"看得出来正在处理"——真正做到提交后可以离开页面、后台跑完
    // 再通知的完整异步方案工作量大得多，暂时不做。
    //
    // GET 表单（比如"生成简历草稿"）和 POST 表单都适用：submit 事件在浏览器
    // 真正发起导航之前触发，两种表单都能在这个事件里插入提示。
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      var message = form.getAttribute("data-llm-loading");
      if (!message) return;

      // 防止用户手快、在结果还没回来之前对同一个表单重复点提交，导致重复
      // 触发一次同样耗时的 LLM 调用。
      if (form.dataset.jobpilotSubmitting === "1") {
        event.preventDefault();
        return;
      }
      form.dataset.jobpilotSubmitting = "1";

      var buttons = form.querySelectorAll('button[type="submit"], input[type="submit"], button:not([type])');
      buttons.forEach(function (btn) { btn.disabled = true; });

      var indicator = document.createElement("div");
      indicator.className = "jobpilot-llm-loading";
      var spinner = document.createElement("span");
      spinner.className = "jobpilot-spinner";
      indicator.appendChild(spinner);
      indicator.appendChild(document.createTextNode(message));
      form.appendChild(indicator);
    });

    // 同样的提示也适用于"点了之后跳一个会调用 LLM 的 GET 页面"的普通链接
    // （比如"生成常见问题"这个 <a> 包 <button> 的入口，不是 <form>，submit
    // 事件覆盖不到）。这里不阻止默认的页面跳转，只是在跳转发生前先插入提示，
    // 让用户在浏览器真正开始加载下一页之前，能看到一下"正在处理"的反馈。
    document.addEventListener("click", function (event) {
      var link = event.target.closest("a[data-llm-loading]");
      if (!link || link.dataset.jobpilotSubmitting === "1") return;
      link.dataset.jobpilotSubmitting = "1";
      link.style.pointerEvents = "none";

      var indicator = document.createElement("div");
      indicator.className = "jobpilot-llm-loading";
      var spinner = document.createElement("span");
      spinner.className = "jobpilot-spinner";
      indicator.appendChild(spinner);
      indicator.appendChild(document.createTextNode(link.getAttribute("data-llm-loading")));
      link.insertAdjacentElement("afterend", indicator);
    });
  </script>
</body>
</html>
